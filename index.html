<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jaydeep Shirsath | ZeroTrace Security OS</title>
  <style>
    :root {
      --bg-core: #04080c;
      --panel-bg: rgba(6, 14, 22, 0.94);
      --card-bg: rgba(10, 24, 38, 0.88);
      --window-border: #00ff9d44;
      --window-border-active: #00ff9d;
      --accent-green: #00ff9d;
      --accent-cyan: #00e5ff;
      --accent-red: #ff3366;
      --accent-yellow: #ffcc00;
      --text-main: #d4f8e8;
      --text-dim: #5c8c76;
      --terminal-font: 'Courier New', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100%; height: 100%;
      background: var(--bg-core);
      color: var(--text-main);
      font-family: var(--terminal-font);
      overflow: hidden;
    }

    /* Ambient Matrix/Hex background canvas */
    #matrix-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    /* CRT scanline scan layer */
    .crt-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
                  linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
      background-size: 100% 3px, 4px 100%;
      pointer-events: none;
      z-index: 9999;
    }

    #desktop {
      position: relative;
      width: 100%;
      height: calc(100% - 46px);
      z-index: 10;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      grid-auto-rows: 95px;
      gap: 15px;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 6px;
      transition: all 0.2s;
    }
    .desktop-icon:hover {
      background: rgba(0, 255, 157, 0.12);
      border-color: var(--window-border-active);
      box-shadow: 0 0 12px rgba(0,255,157,0.3);
    }
    .desktop-icon svg { width: 38px; height: 38px; margin-bottom: 6px; }
    .desktop-icon span {
      font-size: 11px;
      color: var(--text-main);
      text-shadow: 0 1px 4px #000;
      letter-spacing: 0.5px;
    }

    /* Taskbar panel */
    #taskbar {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%; height: 46px;
      background: var(--panel-bg);
      border-top: 1px solid var(--window-border);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 10000;
    }
    .taskbar-left, .taskbar-right { display: flex; align-items: center; gap: 8px; }
    .app-menu-btn {
      background: rgba(0, 255, 157, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .app-menu-btn:hover {
      background: var(--accent-green);
      color: #000;
      box-shadow: 0 0 12px var(--accent-green);
    }

    .window-task-pill {
      background: var(--card-bg);
      border: 1px solid var(--window-border);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .window-task-pill.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }

    .tray-badge {
      font-size: 11px;
      color: var(--accent-cyan);
      padding: 3px 8px;
      background: rgba(0, 229, 255, 0.1);
      border-radius: 3px;
      border: 1px solid #00e5ff33;
    }

    /* Window Frames */
    .os-window {
      position: absolute;
      background: var(--card-bg);
      border: 1px solid var(--window-border);
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0,255,157,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 320px;
      min-height: 220px;
      backdrop-filter: blur(14px);
      z-index: 20;
    }
    .os-window.active-win {
      border-color: var(--window-border-active);
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0,255,157,0.25);
      z-index: 50;
    }

    .window-titlebar {
      height: 34px;
      background: rgba(3, 10, 16, 0.95);
      border-bottom: 1px solid var(--window-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      cursor: move;
    }
    .title-left { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; color: var(--accent-green); }
    .title-actions { display: flex; align-items: center; gap: 6px; }
    .btn-win {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
    }
    .btn-close { background: var(--accent-red); }
    .btn-min { background: var(--accent-yellow); }
    .btn-max { background: var(--accent-green); }

    .window-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      user-select: text;
      font-size: 12px;
      line-height: 1.5;
    }

    /* External link launch bar */
    .external-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--window-border);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .btn-external {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      padding: 5px 12px;
      font-weight: bold;
      font-family: inherit;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-external:hover {
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    /* Terminal Window Styles */
    .terminal-body {
      background: #020508;
      color: #00ff9d;
      font-family: var(--terminal-font);
      padding: 12px;
      height: 100%;
      overflow-y: auto;
    }
    .cli-line { display: flex; margin-top: 6px; align-items: center; }
    .cli-input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      flex-grow: 1;
      caret-color: var(--accent-green);
    }

    /* File Manager Specifics */
    .fm-layout { display: flex; height: 100%; gap: 12px; }
    .fm-sidebar {
      width: 140px;
      border-right: 1px solid var(--window-border);
      padding-right: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .fm-folder-btn {
      padding: 6px;
      border-radius: 4px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fm-folder-btn.active, .fm-folder-btn:hover {
      background: rgba(0,255,157,0.15);
      color: var(--accent-green);
    }
    .fm-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 12px;
      align-content: flex-start;
    }
    .fm-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      text-align: center;
    }
    .fm-item:hover { background: rgba(0, 229, 255, 0.15); }
    .fm-item span { font-size: 10px; margin-top: 4px; word-break: break-all; }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .gallery-card {
      border: 1px solid var(--window-border);
      border-radius: 6px;
      overflow: hidden;
      background: #000;
    }
    .gallery-thumb {
      height: 110px;
      background: #0b1a26;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #00ff9d22;
      color: var(--accent-cyan);
    }
    .gallery-desc { padding: 8px; font-size: 11px; }

    /* Resume Document Viewer */
    .resume-paper {
      background: #ffffff;
      color: #111111;
      padding: 24px;
      border-radius: 4px;
      font-family: Arial, sans-serif;
      line-height: 1.4;
      font-size: 12px;
      user-select: text;
    }
    .resume-paper h1 { font-size: 20px; color: #0b3d60; margin-bottom: 4px; }
    .resume-paper h2 { font-size: 13px; border-bottom: 1px solid #ccddee; padding-bottom: 3px; margin: 12px 0 6px 0; color: #0b3d60; text-transform: uppercase; }
    .resume-paper a { color: #0066cc; }

    /* Start Menu Dropdown */
    #start-menu {
      position: fixed;
      bottom: 50px; left: 10px;
      width: 260px;
      background: var(--panel-bg);
      border: 1px solid var(--accent-green);
      box-shadow: 0 0 20px rgba(0, 255, 157, 0.25);
      border-radius: 6px;
      z-index: 10001;
      display: none;
      flex-direction: column;
      padding: 8px;
    }
    .start-menu-item {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }
    .start-menu-item:hover {
      background: var(--accent-green);
      color: #000;
    }
  </style>
</head>

  <canvas id="matrix-canvas"></canvas>
