<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --term-bg: #030a05;
            --term-fg: #00ff66;
            --term-glow: rgba(0, 255, 102, 0.35);
            --term-dim: #008f39;
            --term-accent: #00e5ff;
            --term-warn: #ffb703;
            --term-err: #ff3344;
            --term-white: #e2e8f0;
            --term-border: rgba(0, 255, 102, 0.2);
            --crt-scanline: rgba(0, 0, 0, 0.28);
        }

        body[data-theme="amber"] {
            --term-bg: #0c0800;
            --term-fg: #ffb000;
            --term-glow: rgba(255, 176, 0, 0.35);
            --term-dim: #b37400;
            --term-accent: #ffd166;
            --term-warn: #ff8800;
            --term-err: #ff3b30;
            --term-white: #fef08a;
            --term-border: rgba(255, 176, 0, 0.25);
        }

        body[data-theme="cyber"] {
            --term-bg: #020b14;
            --term-fg: #00f0ff;
            --term-glow: rgba(0, 240, 255, 0.4);
            --term-dim: #0284c7;
            --term-accent: #e040fb;
            --term-warn: #f59e0b;
            --term-err: #ff2a6d;
            --term-white: #f8fafc;
            --term-border: rgba(0, 240, 255, 0.25);
        }

        body[data-theme="blood"] {
            --term-bg: #0c0204;
            --term-fg: #ff2a4b;
            --term-glow: rgba(255, 42, 75, 0.4);
            --term-dim: #991b1b;
            --term-accent: #fb7185;
            --term-warn: #fb923c;
            --term-err: #f43f5e;
            --term-white: #ffe4e6;
            --term-border: rgba(255, 42, 75, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            background-color: var(--term-bg);
            color: var(--term-fg);
            overflow: hidden;
            font-size: 13.5px;
            text-shadow: 0 0 4px var(--term-glow);
            transition: background 0.3s, color 0.3s;
        }

        /* CRT Screen Scanlines & Vignette Overlay */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, var(--crt-scanline) 50%),
                        radial-gradient(circle at center, transparent 65%, rgba(0, 0, 0, 0.65) 100%);
            background-size: 100% 3px, 100% 100%;
        }

        .crt-flicker {
            animation: flicker 0.15s infinite;
            opacity: 0.015;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: white;
            pointer-events: none;
            z-index: 9998;
        }

        @keyframes flicker {
            0% { opacity: 0.012; }
            50% { opacity: 0.024; }
            100% { opacity: 0.015; }
        }

        /* Shell Container */
        .terminal-window {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding: 8px 12px 14px 12px;
            box-sizing: border-box;
        }

        /* Top Bar */
        .terminal-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--term-border);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 11px;
            color: var(--term-accent);
            user-select: none;
        }

        .terminal-bar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .terminal-dots {
            display: flex;
            gap: 5px;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-red { background: #ff5f56; }
        .dot-yellow { background: #ffbd2e; }
        .dot-green { background: #27c93f; }

        .terminal-bar-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .top-btn {
            background: transparent;
            border: 1px solid var(--term-border);
            color: var(--term-fg);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .top-btn:hover {
            background: var(--term-fg);
            color: var(--term-bg);
            box-shadow: 0 0 8px var(--term-fg);
        }

        /* Output Viewport */
        .terminal-viewport {
            flex: 1;
            overflow-y: auto;
            padding-right: 6px;
            scroll-behavior: smooth;
        }

        .terminal-viewport::-webkit-scrollbar {
            width: 6px;
        }
        .terminal-viewport::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.4);
        }
        .terminal-viewport::-webkit-scrollbar-thumb {
            background: var(--term-dim);
            border-radius: 3px;
        }

        /* Text and Output Styles */
        .line {
            margin-bottom: 4px;
            line-height: 1.5;
            word-break: break-word;
        }

        .ascii-logo {
            font-size: 10.5px;
            line-height: 1.15;
            color: var(--term-fg);
            font-weight: 700;
            white-space: pre;
            margin: 10px 0;
            overflow-x: auto;
        }

        @media (max-width: 768px) {
            .ascii-logo {
                font-size: 6px;
                letter-spacing: -0.5px;
            }
            body {
                font-size: 12px;
            }
        }

        .txt-dim { color: var(--term-dim); }
        .txt-accent { color: var(--term-accent); }
        .txt-warn { color: var(--term-warn); }
        .txt-err { color: var(--term-err); font-weight: 600; }
        .txt-bold { font-weight: 700; color: var(--term-white); }
        .txt-success { color: var(--term-fg); font-weight: 600; }

        .badge-tag {
            display: inline-block;
            background: rgba(0, 255, 102, 0.12);
            border: 1px solid var(--term-border);
            padding: 1px 6px;
            border-radius: 4px;
            margin: 2px 3px 2px 0;
            color: var(--term-white);
            font-size: 11.5px;
        }

        .card-box {
            border: 1px dashed var(--term-border);
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.35);
        }

        .hyperlink {
            color: var(--term-accent);
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }
        .hyperlink:hover {
            color: var(--term-white);
            background: var(--term-dim);
            text-decoration: none;
            padding: 0 2px;
        }

        /* Quick Action Command Chips */
        .chip-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 14px 0;
            padding: 8px;
            border: 1px solid var(--term-border);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.25);
        }

        .chip-label {
            width: 100%;
            font-size: 11px;
            color: var(--term-accent);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chip-btn {
            background: rgba(0, 255, 102, 0.08);
            border: 1px solid var(--term-border);
            color: var(--term-fg);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.18s ease;
        }
        .chip-btn:hover, .chip-btn:active {
            background: var(--term-fg);
            color: var(--term-bg);
            box-shadow: 0 0 10px var(--term-glow);
            transform: translateY(-1px);
        }

        /* CLI Input Row */
        .cli-row {
            display: flex;
            align-items: center;
            margin-top: 8px;
            padding: 4px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cli-prompt {
            color: var(--term-accent);
            font-weight: 600;
            white-space: nowrap;
            margin-right: 8px;
            user-select: none;
        }

        .cli-input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .cli-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--term-white);
            font-size: 14px;
            caret-color: var(--term-fg);
        }

        /* Boot Screen Layer */
        #boot-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: var(--term-bg);
            z-index: 999;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .boot-logs {
            flex: 1;
            font-size: 12px;
            line-height: 1.45;
        }

        .boot-bottom-bar {
            padding-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--term-border);
        }

        .skip-btn {
            background: transparent;
            border: 1px solid var(--term-fg);
            color: var(--term-fg);
            padding: 6px 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 8px var(--term-glow);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>

        // Web Audio API Synthetic Retro Sound Engine
        let audioContext = null;
        let audioMuted = true;

        function initAudio() {
            if (!audioContext) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) audioContext = new AudioCtx();
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playKeySound(type = 'key') {
            if (audioMuted || !audioContext) return;
            try {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);

                const now = audioContext.currentTime;
                if (type === 'beep') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'enter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    gain.gain.setValueAtTime(0.07, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else {
                    // Click sound
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(550 + Math.random() * 200, now);
                    gain.gain.setValueAtTime(0.025, now);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
                    osc.start(now);
                    osc.stop(now + 0.035);
                }
            } catch (e) {
                // Ignore audio failure
            }
        }

        function toggleAudio() {
            initAudio();

            }
        };

        // Aliases
        commands["ls"] = () => `<div>about.txt&nbsp;&nbsp;skills.bin&nbsp;&nbsp;projects.db&nbsp;&nbsp;flag.txt&nbsp;&nbsp;platforms.cfg&nbsp;&nbsp;contact.pem</div>`;
        commands["cat about.txt"] = commands.about;
        commands["cat skills.bin"] = commands.skills;
        commands["cat projects.db"] = commands.projects;
        commands["cat platforms.cfg"] = commands.platforms;
        commands["cat contact.pem"] = commands.contact;
        commands["exit"] = () => `<div>[SESSION DETACH] Refresh browser window to reinitialize.</div>`;

        const cmdHistory = [];
        let historyIdx = -1;

        function executeCommand(inputStr) {
            initAudio();
            const trimmed = inputStr.trim();
            if (!trimmed) return;

            // Log prompt line to screen
            appendOutput(`<div><span class="cli-prompt">guest@jaydeep-sec:~$</span> <span class="txt-white">${escapeHTML(trimmed)}</span></div>`);

            cmdHistory.unshift(trimmed);
            historyIdx = -1;

            const normalized = trimmed.toLowerCase();

            playKeySound('enter');

            if (commands[normalized]) {
                const result = commands[normalized]();
                if (result) appendOutput(result);
            } else {
                appendOutput(`<div class="txt-err">[-] bash: ${escapeHTML(trimmed)}: command not found. Type <span class="txt-accent" onclick="executeCommand('help')" style="cursor:pointer; text-decoration:underline;">help</span> to inspect valid operations.</div>`);
                playKeySound('beep');
            }

            viewport.scrollTop = viewport.scrollHeight;
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Input Listener
        cliInput.addEventListener('keydown', (e) => {
            initAudio();

            if (e.key === 'Enter') {
                const cmd = cliInput.value;
                cliInput.value = '';
                executeCommand(cmd);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (cmdHistory.length > 0 && historyIdx + 1 < cmdHistory.length) {
                    historyIdx++;
                    cliInput.value = cmdHistory[historyIdx];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (historyIdx > 0) {
                    historyIdx--;
                    cliInput.value = cmdHistory[historyIdx];
                } else {
                    historyIdx = -1;
                    cliInput.value = '';
                }
            } else if (e.key === 'Tab') {
                e.preventDefault();
                const curr = cliInput.value.toLowerCase().trim();
                const keys = Object.keys(commands);
                const match = keys.find(k => k.startsWith(curr));
                if (match) {
                    cliInput.value = match;
                    playKeySound('key');
                }
            } else {
                playKeySound('key');
            }
        });

        // Always refocus CLI input on click outside links/buttons
        document.addEventListener('click', (e) => {
            if (!['A', 'BUTTON', 'INPUT'].includes(e.target.tagName)) {
                cliInput.focus();
            }
        });
    </script>
