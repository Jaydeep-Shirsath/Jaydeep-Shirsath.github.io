<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaydeep Shirsath | ZeroTrace Hacker OS</title>
    <style>
        :root {
            --bg-base: #05080c;
            --bg-surface: #0a1017;
            --bg-elevated: #111a24;
            --border-dim: #182836;
            --neon-green: #00ff66;
            --neon-cyan: #00e5ff;
            --neon-amber: #ffb700;
            --neon-red: #ff3344;
            --text-main: #d4e0eb;
            --text-dim: #71889c;
            --font-mono: 'Consolas', 'Fira Code', 'Courier New', monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --taskbar-h: 42px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 13px;
        }

        #matrixCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.16;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 3px;
            z-index: 99998;
            pointer-events: none;
            opacity: 0.3;
        }

        #desktop {
            position: relative;
            width: 100%;
            height: calc(100% - var(--taskbar-h));
            z-index: 1;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 86px);
            grid-template-rows: repeat(auto-fill, 96px);
            grid-auto-flow: column;
            gap: 12px;
            align-content: start;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 86px;
            height: 94px;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            text-align: center;
            border: 1px solid transparent;
        }

        .desktop-icon:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.25);
            transform: translateY(-2px);
        }

        .desktop-icon svg {
            width: 38px;
            height: 38px;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 6px rgba(0, 229, 255, 0.4));
        }

        .desktop-icon span {
            font-size: 11px;
            font-family: var(--font-mono);
            color: #ecf3f8;
            text-shadow: 0 1px 3px #000;
            line-height: 1.2;
            word-break: break-word;
        }

        .window {
            position: absolute;
            background: var(--bg-surface);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 0 1px rgba(0, 229, 255, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
            min-width: 320px;
            min-height: 220px;
        }

        .window.active {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0,0,0,0.85), 0 0 12px rgba(0, 229, 255, 0.25);
            z-index: 100;
        }

        .window-header {
            height: 36px;
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            cursor: move;
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--neon-cyan);
            font-weight: 600;
        }

        .window-title svg {
            width: 16px;
            height: 16px;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .win-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: filter 0.15s;
        }
        .win-btn:hover { filter: brightness(1.3); }
        .win-close { background: var(--neon-red); }
        .win-min { background: var(--neon-amber); }
        .win-max { background: var(--neon-green); }

        /* Real WebApp Browser Toolbar */
        .browser-toolbar {
            height: 40px;
            background: #090f17;
            border-bottom: 1px solid var(--border-dim);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 10px;
        }

        .browser-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }
        .browser-nav-btn:hover { color: var(--neon-cyan); background: rgba(0, 229, 255, 0.1); }

        .browser-omnibox {
            flex: 1;
            height: 28px;
            background: #05080c;
            border: 1px solid var(--border-dim);
            border-radius: 14px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-family: var(--font-mono);
            font-size: 11.5px;
            color: var(--text-dim);
            gap: 8px;
        }

        .browser-omnibox input {
            background: transparent;
            border: none;
            outline: none;
            color: #d1dde8;
            font-family: var(--font-mono);
            font-size: 11.5px;
            width: 100%;
        }

        .browser-open-btn {
            background: rgba(0, 229, 255, 0.12);
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 229, 255, 0.35);
            padding: 4px 10px;
            border-radius: 14px;
            font-family: var(--font-mono);
            font-size: 11px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .browser-open-btn:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        .window-body {
            flex: 1;
            overflow: auto;
            position: relative;
            background: var(--bg-surface);
            color: var(--text-main);
            user-select: text;
        }

        #taskbar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: var(--taskbar-h);
            background: rgba(7, 12, 17, 0.94);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-dim);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 9999;
        }

        .start-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 229, 255, 0.12);
            border: 1px solid rgba(0, 229, 255, 0.4);
            color: var(--neon-cyan);
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .start-btn:hover {
            background: rgba(0, 229, 255, 0.25);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .taskbar-tasks {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 12px;
            overflow-x: auto;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            color: var(--text-main);
            font-size: 11px;
            font-family: var(--font-mono);
            cursor: pointer;
            max-width: 150px;
            white-space: nowrap;
        }

        .task-item.active {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 229, 255, 0.1);
        }

        .tray {
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 11px;
        }

        #startMenu {
            position: fixed;
            bottom: calc(var(--taskbar-h) + 6px);
            left: 10px;
            width: 280px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            box-shadow: 0 16px 36px rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 10000;
        }

        .start-header {
            padding: 12px;
            background: rgba(0, 229, 255, 0.08);
            border-bottom: 1px solid var(--border-dim);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .start-list { padding: 6px 0; list-style: none; }
        .start-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            color: var(--text-main);
            cursor: pointer;
            font-size: 12px;
            font-family: var(--font-mono);
        }
        .start-item:hover {
            background: rgba(0, 229, 255, 0.15);
            color: var(--neon-cyan);
            padding-left: 18px;
        }

        /* App-Specific Styles */
        .term-container {
            height: 100%;
            background: #030608;
            color: var(--neon-green);
            font-family: var(--font-mono);
            font-size: 12.5px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .term-output { line-height: 1.5; white-space: pre-wrap; margin-bottom: 8px; }
        .term-input-row { display: flex; align-items: center; gap: 6px; }
        .term-prompt { color: var(--neon-cyan); white-space: nowrap; }
        .term-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-family: var(--font-mono); font-size: 12.5px; caret-color: var(--neon-green);
        }

        .fm-container { display: flex; height: 100%; }
        .fm-sidebar {
            width: 150px; background: var(--bg-elevated); border-right: 1px solid var(--border-dim);
            padding: 8px; font-family: var(--font-mono); font-size: 11px;
        }
        .fm-nav-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px;
            cursor: pointer; color: var(--text-dim); margin-bottom: 2px;
        }
        .fm-nav-item:hover, .fm-nav-item.active { background: rgba(0, 229, 255, 0.12); color: var(--neon-cyan); }
        .fm-content {
            flex: 1; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, 90px);
            grid-auto-rows: 90px; gap: 12px; overflow-y: auto;
        }
        .fm-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 6px; border-radius: 6px; cursor: pointer; text-align: center;
            font-family: var(--font-mono); font-size: 11px; border: 1px solid transparent;
        }
        .fm-item:hover { background: rgba(0, 229, 255, 0.08); border-color: rgba(0, 229, 255, 0.2); }
        .fm-item svg { width: 32px; height: 32px; margin-bottom: 6px; }

        /* WebApp Inside Window Content */
        .webapp-view {
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            background: #070c12;
            font-family: var(--font-sans);
        }

        .yt-embed-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-dim);
        }
        .yt-embed-box iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .stat-badge {
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
        }

        /* Printable Resume */
        @media print {
            body * { visibility: hidden; }
            #resumePaper, #resumePaper * { visibility: visible; }
            #resumePaper {
                position: absolute; left: 0; top: 0; width: 100%;
                background: #fff !important; color: #000 !important; border: none !important;
            }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>
    <div class="scanlines"></div>

    <div id="desktop"></div>

    <div id="taskbar">
        <button class="start-btn" onclick="toggleStartMenu()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            ZeroTrace OS
        </button>
        <div class="taskbar-tasks" id="taskbarTasks"></div>
        <div class="tray">
            <span id="audioToggle" style="cursor:pointer;" onclick="toggleAudio()">🔊 FX: ON</span>
            <span>IP: 10.10.14.88 (tun0)</span>
            <span id="clock" style="font-weight:600; color:#fff;">00:00:00</span>
        </div>
    </div>

    <div id="startMenu">
        <div class="start-header">Jaydeep Shirsath (root)</div>
        <ul class="start-list">
            <li class="start-item" onclick="openApp('terminal'); toggleStartMenu();">Terminal Console</li>
            <li class="start-item" onclick="openApp('files'); toggleStartMenu();">File Manager</li>
            <li class="start-item" onclick="openApp('resume'); toggleStartMenu();">Resume (PDF Viewer)</li>
            <li class="start-item" onclick="openApp('thm'); toggleStartMenu();">TryHackMe Station</li>
            <li class="start-item" onclick="openApp('htb'); toggleStartMenu();">Hack The Box Station</li>
            <li class="start-item" onclick="openApp('credly'); toggleStartMenu();">Credly Credentials</li>
            <li class="start-item" onclick="openApp('youtube'); toggleStartMenu();">YouTube App (@js44)</li>
            <li class="start-item" onclick="openApp('linkedin'); toggleStartMenu();">LinkedIn Dossier</li>
            <li class="start-item" onclick="openApp('trash'); toggleStartMenu();">Recycle Bin</li>
        </ul>
    </div>

    <script>
        let audioCtx = null;
        let soundEnabled = true;

        function playBeep(freq = 600, duration = 0.05) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('audioToggle').innerText = soundEnabled ? '🔊 FX: ON' : '🔈 FX: OFF';
        }

        // Matrix background
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        const chars = '01ABCDEF<>{}/*+=~_JAYDEEP_SHIRSATH_PENTEST_ROOT';
        let cols = Math.floor(width / 14);
        let drops = Array(cols).fill(1);

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cols = Math.floor(width / 14);
            drops = Array(cols).fill(1);
        });

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 8, 12, 0.08)';
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = '#00ff66';
            ctx.font = '14px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * 14, drops[i] * 14);
                if (drops[i] * 14 > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 42);

        // App Definitions with Web Browser OmniBars
        const APPS = {
            terminal: {
                id: 'terminal', title: 'root@zerotrace:~ (CLI)',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
                width: 720, height: 460, x: 80, y: 50, render: renderTerminal
            },
            files: {
                id: 'files', title: 'File Manager (/home/jaydeep)',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
                width: 680, height: 420, x: 120, y: 70, render: renderFileManager
            },
            resume: {
                id: 'resume', title: 'Document Viewer - Jaydeep_Resume.pdf',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
                width: 780, height: 520, x: 150, y: 60, render: renderResume
            },
            youtube: {
                id: 'youtube', title: 'YouTube App - @js44',
                url: 'https://youtube.com/@js44?si=4xPaJYq3JOWW5VBK',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff3344" stroke-width="2"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>',
                width: 760, height: 530, x: 140, y: 60, render: renderYouTube
            },
            thm: {
                id: 'thm', title: 'TryHackMe App - Jaydeep.Shirsath',
                url: 'https://tryhackme.com/p/Jaydeep.Shirsath',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff3344" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/></svg>',
                width: 700, height: 480, x: 170, y: 70, render: renderTHM
            },
            htb: {
                id: 'htb', title: 'Hack The Box App',
                url: 'https://profile.hackthebox.com/profile/019e6d7d-e327-7384-82d6-298def550f7d?utm_medium=copy_url',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/></svg>',
                width: 700, height: 480, x: 200, y: 80, render: renderHTB
            },
            credly: {
                id: 'credly', title: 'Credly Credentials App',
                url: 'https://www.credly.com/users/jaydeep-shirsath',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#ffb700" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',
                width: 700, height: 470, x: 220, y: 90, render: renderCredly
            },
            linkedin: {
                id: 'linkedin', title: 'LinkedIn App',
                url: 'https://www.linkedin.com/in/jaydeep-shirsath-82452a380?utm_source=share_via&utm_content=profile&utm_medium=member_android',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>',
                width: 700, height: 480, x: 190, y: 70, render: renderLinkedIn
            },
            trash: {
                id: 'trash', title: 'Recycle Bin',
                icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff3344" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
                width: 520, height: 340, x: 260, y: 110, render: renderTrash
            }
        };

        const desktop = document.getElementById('desktop');
        Object.values(APPS).forEach(app => {
            const el = document.createElement('div');
            el.className = 'desktop-icon';
            let label = app.id.toUpperCase();
            if (app.id === 'resume') label = 'Resume.pdf';
            if (app.id === 'thm') label = 'TryHackMe';
            if (app.id === 'htb') label = 'HackTheBox';
            if (app.id === 'credly') label = 'Credly';
            el.innerHTML = `${app.icon}<span>${label}</span>`;
            el.ondblclick = () => openApp(app.id);
            el.onclick = () => playBeep(900, 0.03);
            desktop.appendChild(el);
        });

        // Window Manager
        const windows = {};
        let topZ = 20;

        function openApp(appId) {
            playBeep(700, 0.04);
            if (windows[appId]) {
                windows[appId].style.display = 'flex';
                focusWindow(appId);
                return;
            }

            const app = APPS[appId];
            const winEl = document.createElement('div');
            winEl.className = 'window active';
            winEl.id = `win_${appId}`;
            winEl.style.width = `${app.width}px`;
            winEl.style.height = `${app.height}px`;
            winEl.style.left = `${Math.min(window.innerWidth - app.width - 20, Math.max(30, app.x))}px`;
            winEl.style.top = `${Math.min(window.innerHeight - app.height - 60, Math.max(30, app.y))}px`;
            winEl.style.zIndex = ++topZ;

            // Generate Browser-style Toolbar if app has URL
            let toolbarHtml = '';
            if (app.url) {
                toolbarHtml = `
                    <div class="browser-toolbar">
                        <button class="browser-nav-btn" onclick="alert('Browser navigation: Home')">◀</button>
                        <button class="browser-nav-btn" onclick="alert('Forward')">▶</button>
                        <button class="browser-nav-btn" onclick="openApp('${appId}')">⟳</button>
                        <div class="browser-omnibox">
                            <span style="color:var(--neon-green)">🔒</span>

        function focusWindow(appId) {
            Object.values(windows).forEach(w => w.classList.remove('active'));
            if (windows[appId]) {
                windows[appId].classList.add('active');
                windows[appId].style.zIndex = ++topZ;
            }
            updateTaskbar();
        }

        function closeWindow(appId) {
            playBeep(450, 0.05);
            if (windows[appId]) {
                windows[appId].remove();
                delete windows[appId];
            }
            updateTaskbar();
        }

        function minimizeWindow(appId) {
            if (windows[appId]) windows[appId].style.display = 'none';
            updateTaskbar();
        }

        function maximizeWindow(appId) {
            const win = windows[appId];
            if (!win) return;
            if (win.dataset.maximized === 'true') {
                win.style.width = win.dataset.origW;
                win.style.height = win.dataset.origH;
                win.style.left = win.dataset.origL;
                win.style.top = win.dataset.origT;
                win.dataset.maximized = 'false';
            } else {
                win.dataset.origW = win.style.width;
                win.dataset.origH = win.style.height;
                win.dataset.origL = win.style.left;
                win.dataset.origT = win.style.top;
                win.style.left = '0px'; win.style.top = '0px';
                win.style.width = '100%'; win.style.height = `calc(100% - var(--taskbar-h))`;
                win.dataset.maximized = 'true';
            }
        }

        function updateTaskbar() {
            const container = document.getElementById('taskbarTasks');
            container.innerHTML = '';
            Object.keys(windows).forEach(appId => {
                const app = APPS[appId];
                const win = windows[appId];
                const isActive = win.classList.contains('active') && win.style.display !== 'none';
                const pill = document.createElement('div');
                pill.className = `task-item ${isActive ? 'active' : ''}`;
                pill.innerHTML = `${app.icon} <span>${app.id.toUpperCase()}</span>`;
                pill.onclick = () => {
                    if (win.style.display === 'none') {
                        win.style.display = 'flex';
                        focusWindow(appId);
                    } else if (isActive) {
                        minimizeWindow(appId);
                    } else {
                        focusWindow(appId);
                    }
                };
                container.appendChild(pill);
            });
        }

        let draggedWin = null, dragOffsetX = 0, dragOffsetY = 0;
        function startDrag(e, appId) {
            focusWindow(appId);
            draggedWin = windows[appId];
            if (draggedWin.dataset.maximized === 'true') return;
            const rect = draggedWin.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', stopDrag);
        }
        function onDrag(e) {
            if (!draggedWin) return;
            draggedWin.style.left = `${Math.max(0, e.clientX - dragOffsetX)}px`;
            draggedWin.style.top = `${Math.max(0, e.clientY - dragOffsetY)}px`;
        }
        function stopDrag() {
            draggedWin = null;
            window.removeEventListener('mousemove', onDrag);
            window.removeEventListener('mouseup', stopDrag);
        }
